openapi: 3.0.0
info:
  title: Boards API
  version: 0.0.1
servers:
  - url: /
tags:
  - name: Board
    description: Boards endpoints

paths:
  /v1/boards:
    $ref: "./paths/boards.yaml#/boards"
  /v1/boards/{boardId}:
    $ref: "./paths/boards.yaml#/boards-id"
  /v1/boards/create:
    $ref: "./paths/boards.yaml#/boards-create"
  /v1/boards/delete:
    $ref: "./paths/boards.yaml#/boards-delete"
  /v1/boards/update:
    $ref: "./paths/boards.yaml#/boards-update"
  /v1/boards/join:
    $ref: "./paths/boards.yaml#/boards-join"

components:
  securitySchemes:
    security_root:
      $ref: "./components/security.yaml#/security_root"

  schemas:
    # common
    StatusEnum:
      $ref: "./components/schemas/common.yaml#/StatusEnum"
    OkResponseBase:
      $ref: "./components/schemas/common.yaml#/OkResponseBase"
    ErrorResponse:
      $ref: "./components/schemas/common.yaml#/ErrorResponse"
    Forbidden:
      $ref: "./components/schemas/common.yaml#/Forbidden"
    NotFound:
      $ref: "./components/schemas/common.yaml#/NotFound"
    BadRequest:
      $ref: "./components/schemas/common.yaml#/BadRequest"
    Unauthorized:
      $ref: "./components/schemas/common.yaml#/Unauthorized"
    InternalError:
      $ref: "./components/schemas/common.yaml#/InternalError"
    InviteType:
      $ref: "./components/schemas/common.yaml#/InviteType"

    # boards
    CreateBoardBody:
      $ref: "./components/schemas/boards.yaml#/CreateBoardBody"
    UpdateBoardBody:
      $ref: "./components/schemas/boards.yaml#/UpdateBoardBody"
    DeleteBoardBody:
      $ref: "./components/schemas/boards.yaml#/DeleteBoardBody"
    JoinBoardBody:
      $ref: "./components/schemas/boards.yaml#/JoinBoardBody"

    Board:
      $ref: "./components/schemas/boards.yaml#/Board"
    Invite:
      $ref: "./components/schemas/boards.yaml#/Invite"
    Like:
      $ref: "./components/schemas/boards.yaml#/Like"
    Card:
      $ref: "./components/schemas/boards.yaml#/Card"
    Column:
      $ref: "./components/schemas/boards.yaml#/Column"
    BoardSnapshot:
      $ref: "./components/schemas/boards.yaml#/BoardSnapshot"

    BoardResponse:
      $ref: "./components/schemas/boards.yaml#/BoardResponse"
    BoardsResponse:
      $ref: "./components/schemas/boards.yaml#/BoardsResponse"
    CreateBoardResponse:
      $ref: "./components/schemas/boards.yaml#/CreateBoardResponse"
    DeleteBoardResponse:
      $ref: "./components/schemas/boards.yaml#/DeleteBoardResponse"
    JoinBoardResponse:
      $ref: "./components/schemas/boards.yaml#/JoinBoardResponse"
    UpdateBoardResponse:
      $ref: "./components/schemas/boards.yaml#/UpdateBoardResponse"
