CreateBoardBody:
  type: object
  required: [title]
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200

UpdateBoardBody:
  type: object
  required: [id, title]
  properties:
    id:
      type: string
      minLength: 1
    title:
      type: string
      minLength: 1
      maxLength: 200

DeleteBoardBody:
  type: object
  required: [id]
  properties:
    id:
      type: string
      minLength: 1

JoinBoardBody:
  type: object
  required: [token]
  properties:
    token:
      type: string
      minLength: 1
      example: a1B2c3D4e5F6

Board:
  type: object
  required: [id, title, ownerUserId, createdAt]
  properties:
    id:
      type: string
    title:
      type: string
    ownerUserId:
      type: string
    createdAt:
      type: string
      format: date-time

Like:
  type: object
  required: [userLogin]
  properties:
    userLogin:
      type: string

Card:
  type: object
  required: [id, text, userLogin, position, likes]
  properties:
    id:
      type: string
    text:
      type: string
    userLogin:
      type: string
    position:
      type: number
      format: decimal
    likes:
      type: array
      items:
        $ref: "#/Like"

Column:
  type: object
  required: [id, position, title, cards]
  properties:
    id:
      type: string
    position:
      type: number
      format: decimal
    title:
      type: string
    cards:
      type: array
      items:
        $ref: "#/Card"

Invite:
  type: object
  required: [type, expiresAt, token]
  properties:
    type:
      $ref: "./common.yaml#/InviteType"
    expiresAt:
      type: string
      format: date-time
      nullable: true
    token:
      type: string
      minLength: 12
      maxLength: 12
      pattern: "^[0-9A-Za-z]{12}$"

BoardSnapshot:
  type: object
  required: [id, title, ownerUserId, createdAt, invites, columns]
  properties:
    id:
      type: string
    title:
      type: string
    ownerUserId:
      type: string
    createdAt:
      type: string
      format: date-time
    invites:
      type: array
      items:
        $ref: "#/Invite"
    columns:
      type: array
      items:
        $ref: "#/Column"

JoinBoardResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          type: object
          required: [boardId]
          boardId:
            type: string

BoardsResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/Board"

BoardResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          $ref: "#/BoardSnapshot"

CreateBoardResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          $ref: "#/Board"

UpdateBoardResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          $ref: "#/Board"

DeleteBoardResponse:
  allOf:
    - $ref: "./common.yaml#/OkResponseBase"
    - type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id:
              type: string
