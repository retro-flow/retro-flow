StatusEnum:
  type: string
  enum: [ok, error]

InviteType:
  type: string
  enum: [TEMPORARY, PERMANENT]

OkResponseBase:
  type: object
  required: [status]
  properties:
    status:
      const: ok

ErrorResponse:
  type: object
  required: [status, message, code]
  properties:
    status:
      const: error
    message:
      type: string
    code:
      type: string

Forbidden:
  allOf:
    - $ref: "#/ErrorResponse"

NotFound:
  allOf:
    - $ref: "#/ErrorResponse"

BadRequest:
  allOf:
    - $ref: "#/ErrorResponse"

Unauthorized:
  allOf:
    - $ref: "#/ErrorResponse"

InternalError:
  allOf:
    - $ref: "#/ErrorResponse"
