StatusEnum:
  type: string
  enum: [ok, error]

InviteType:
  type: string
  enum: [TEMPORARY, PERMANENT]

# TODO: rename
OkResponseBase:
  type: object
  required: [status]
  properties:
    status:
      const: ok

SuccessResponse:
  type: object
  required: [status]
  properties:
    status:
      const: ok

ErrorResponse:
  type: object
  required: [status, message, code]
  properties:
    status:
      const: error
    message:
      type: string
    code:
      type: string

Forbidden:
  description: Forbidden
  content:
    application/json:
      schema:
        $ref: "#/ErrorResponse"

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: "#/ErrorResponse"

BadRequest:
  description: Bad request (validation)
  content:
    application/json:
      schema:
        $ref: "#/ErrorResponse"

Unauthorized:
  description: Unauthorized
  content:
    application/json:
      schema:
        $ref: "#/ErrorResponse"

InternalError:
  description: Internal server error
  content:
    application/json:
      schema:
        $ref: "#/ErrorResponse"
